<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Security policy: only this site's own files, the Firebase SDK from gstatic and Google's Firebase APIs may run or be contacted.
     No inline scripts at all (the app lives in app.js), so injected script tags and onerror-style handlers can't run.
     Firebase Hosting sends the same policy as a header (firebase.json); this tag covers GitHub Pages and local testing. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com; frame-src https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dentsu Ads Workspace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23323232'/%3E%3Ccircle cx='24' cy='24' r='9' fill='%23646ED2'/%3E%3Cpath d='M6 44 44 4' stroke='%23F0BEBE' stroke-width='4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#323232">
<meta name="description" content="dentsu Ads Workspace — every client account in one platform: briefs, workflow, tasks, campaign tracking, activity logs and dashboards.">
<link rel="preload" href="fonts/work-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<!-- Settings live in config.js next to this file. -->
<script src="config.js"></script>
</head>

<div id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
